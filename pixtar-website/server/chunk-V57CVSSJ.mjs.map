<!-- client section ends -->
<section class="section client bg1 bannerLightColor u-section-80">
    <div class="container">
        <div class="row">
            <div class="col-xxl-12 col-xl-11 col-lg-11 col-md-11 col-ms-11 col-11 mx-auto">
                <div class="logos">
                    <h3 class=" mb-0 semibold text-capitalize mbrem8" [class]="translationService.currentLang() === 'ar' ? 'size18' : 'size12'">
                        {{ translationService.currentLang() === 'ar' ? 'عملائنا يشملون...' : 'Our clients include...' }}
                    </h3>
                    <swiper-container breakpoints='{
    "320": { "slidesPerView": 2, "spaceBetween": 10 },
    "480": { "slidesPerView": 3, "spaceBetween": 12 },
    "768": { "slidesPerView": 4, "spaceBetween": 15 },
    "1024": { "slidesPerView": 6, "spaceBetween": 20 }
}' loop="true" speed="3000" autoplay="true" autoplay-delay="1" autoplay-disable-on-interaction="false" class="my-5 ">
                        <swiper-slide *ngFor="let client of filteredClients">
                            <div class="logo-box">
                                <img [src]="client.src" [alt]="client.alt" [title]="client.title" width="210"
                                    height="57" class="img-fluid" loading="lazy" />
                            </div>
                        </swiper-slide>
                    </swiper-container>
                </div>
            </div>
        </div>
    </div>
</section>
