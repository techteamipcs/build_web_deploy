<section class="bg-black hard-work" *ngIf="allprojects?.length > 0">
	<div class="container d-none d-lg-block">
		<div class="row">
			<div class="col-11 mx-auto">
				<div class="d-flex justify-content-start align-items-center cmargin">
					<h2 class="text-white size32 bold">
						<div class="line"></div>
						{{ 'WORKS.RECENT_WORK' | translate }}
					</h2>
				</div>
			</div>
			<div class="col-11 mx-auto">
				<div class="row">
					<div class="col-md-6" *ngFor="let project of allprojects; let i = index">
						<div class="imgblock">
							<a [href]="(project.link && project.link !== '#')
            ? project.link
            : (project.url_key && project.url_key !== '#')
              ? translationService.localizedPath('/project-details/' + project.url_key)
              : null" [attr.target]="project.link && project.link !== '#' ? '_blank' : null"
								[class.disabled-link]="(!project.link || project.link === '#') && (!project.url_key || project.url_key === '#')"
								rel="noopener noreferrer">

								<img src="{{ imagePath }}project/{{ project.image_thumnail.src}}" alt="{{ project.name }}"
									class="galleryimg{{ i }}" loading="lazy" width="440" height="540" title="{{ project.name }}" />

								<div class="box-name text-center">
									<p class="mb-0 c-text-textcolor5 h2 bold">
										{{ translationService.currentLang() === 'ar' ? project.name_ar : project.name }}
									</p>

									<p class="textcolor4 light"
										[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size16 '">
										<span [innerHTML]="translationService.currentLang() === 'ar' ? project.desc_ar : project.desc">
										</span>
									</p>
								</div>
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="customslider d-block d-lg-none px-5" data-aos="fade-up" data-aos-duration="1000">
		<div class="col-md-10 offset-md-1">
			<div class="d-flex justify-content-start align-items-center cmargin">
				<h2 class="text-white h1">
					<div class="line"></div>
					{{ 'WORKS.RECENT_WORK' | translate }}
				</h2>
			</div>
		</div>
		<swiper-container *ngIf="allprojects.length > 0" [config]="recentoptions">
			<swiper-slide *ngFor="let project of allprojects; let i = index">
				<a [href]="(project.link && project.link !== '#')
      ? project.link
      : (project.url_key && project.url_key !== '#')
        ? translationService.localizedPath('/project-details/' + project.url_key)
        : null"
   [attr.target]="project.link && project.link !== '#' ? '_blank' : null"
   [class.disabled-link]="(!project.link || project.link === '#') && (!project.url_key || project.url_key === '#')"
   rel="noopener noreferrer">
					<img [src]="imagePath + 'project/' + project.image_thumnail.src" loading="lazy" width="440" height="540"
						[title]="translationService.currentLang() === 'ar' ? project.name_ar : project.name"
						[alt]="translationService.currentLang() === 'ar' ? project.name_ar : project.name" />
					<div class="box-name text-center">
						<p class="mb-0 c-text-textcolor5 h2">{{
							translationService.currentLang() === 'ar' ? project.name_ar : project.name
							}}</p>
						<p class="textcolor4" [class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size16 '">
							<span [innerHTML]="translationService.currentLang() === 'ar' ? project.desc_ar : project.desc"></span>
						</p>
					</div>
				</a>
			</swiper-slide>
		</swiper-container>
	</div>

	<div class="section bannerdrk container p-0 overflow-hidden">
		<div class="row">
			<div class="col-md-10 m-auto">
				<div class="d-flex flex-column justify-content-center align-items-center video-block">
					<div class="position-relative">
						<div class="float-start cwd243">
							<div class="linkToPackages">
								<a type="button" (click)="bookConsultation()" rel="nofollow"
									class="d-flex justify-content-start align-items-center">
									<span class="text semibold text-white text-capitalize"
										[class]="translationService.currentLang() === 'ar' ? 'size16 ' : 'size14 '">
										{{ 'WORKS.BOOK_A_CONSULTATION' | translate }}
									</span>
									<lucide-icon [name]="translationService.currentLang() === 'ar' ? 'chevron-left' : 'chevron-right'"
										class="lucide-arrow-icon"></lucide-icon>
									<span class="borderspan"> </span>
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
