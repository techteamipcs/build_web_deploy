<div class="popup-overlay" *ngIf="isVisible" (click)="close()">
  <div class="popup-card" (click)="$event.stopPropagation()">

    <!-- Close button -->
    <button class="popup-close" (click)="close()" aria-label="Close">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M1 1L11 11M11 1L1 11" stroke="black" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <!-- Left: Search animation -->
    <div class="popup-illustration">
      <div #lottieContainer class="popup-lottie" role="img"
        aria-label="Compare your website with your competitor."></div>
    </div>

    <!-- Right: Content -->
    <div class="popup-content">
      <div class="popup-content-wrapper">
        <p class="popup-heading size53 light">
          {{ 'COMPARE.BUTTON.TITLE' | translate }} <span class="barcely">{{ 'COMPARE.BUTTON.WEBSITE_TEXT' | translate
            }}</span><br>
          <!-- {{ 'COMPARE.BUTTON.WORKING_AS_HARD' | translate }}<br>
          {{ 'COMPARE.BUTTON.AS_IT_SHOULD_BE' | translate }} -->
           {{ 'COMPARE.BUTTON.FALLING_BEHIND' | translate }}
        </p>
        <p class="popup-subtitle c-text-textcolor1 text-start">{{ 'COMPARE.BUTTON.SUBTITLE' | translate }}</p>
        <div class="box">
          <a [routerLink]="translationService.localizedPath('/compare')" class="popup-btn semibold" (click)="close()">
            {{ 'COMPARE.BUTTON.BUTTON_TEXT' | translate }}
          </a>
          
        </div>
      </div>
    </div>

  </div>
</div>
