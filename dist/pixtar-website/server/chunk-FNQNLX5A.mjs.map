<section class="brand-audit-section">
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-lg-8 col-xl-9">
				<div class="label-badge" data-aos="fade-up" data-aos-duration="2000" data-aos-delay="100">
					<div class="dot"></div>
					<span
						class="lufgasemibold text-uppercase letterspacing10"
						[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size14 '"
						>{{ sectionKey + '.BADGE' | translate }}</span
					>
				</div>

				<h1 class="lufgalight size90 mb-5">
					<ng-container *ngFor="let part of getTitleParts()">
						<br class="d-none d-md-block" *ngIf="part.break" />
						<span
							[class.lufgamedium]="part.style === 'medium'"
							[class.barcely]="part.style === 'barcely'"
							>{{ part.text }}</span
						>
					</ng-container>
				</h1>

				<p
					#revealText
					*ngFor="let description of getDescriptions()"
					class="mb-4 regular size24 line-height51 reveal-text"
				>
					{{ description }}
				</p>

				<a [routerLink]="consultationLink" class="lufgasemibold slideup-btn size14">
					<span>
						{{ sectionKey + '.BUTTON' | translate }}
					</span>
					<span>
						{{ sectionKey + '.BUTTON' | translate }}
					</span>
				</a>
			</div>
		</div>
	</div>
</section>
