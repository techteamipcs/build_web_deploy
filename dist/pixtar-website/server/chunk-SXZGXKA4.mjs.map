<section class="u-section-80 gratio" id="golden-ratio">
	<div class="container">
		<div class="row">
			<div class="col-12 mx-auto">
				<div class="col-12 mb-md-5 mb-2">
					<h2 class="size90">
						<span class="inline lufgaregular">
							{{ 'GOLDENRATIO.TITLE1' | translate }}
						</span>

						<span class="barcely inline">
							{{ 'GOLDENRATIO.TITLE2' | translate }}
						</span>
						<br class="d-none d-md-block">

						<span class="inline c-text-textcolor2 lufgalight">
							{{ 'GOLDENRATIO.TITLE3' | translate }}
						</span>
					</h2>
				</div>

				<div class="row gx-2 gx-lg-3 align-items-stretch ">
					<div class="col-lg-6 col-12 d-flex align-items-center justify-content-center">
						<img
							src="/images/home/ratio.png"
							alt="ratio"
							title="ratio"
							width="450"
							height="340"
							fetchpriority="high"
							loading="eager"
							decoding="async"
							class="diagram-image mx-auto h-100 w-100 "
						/>
					</div>
					<div class="col-lg-6 col-12 d-flex flex-column justify-content-center">

						<p
							class="lufgaregular mb-md-4 mb-sm-3 mb-2"
							[class]="
								translationService.currentLang() === 'ar'
									? 'size22'
									: 'size24'
							"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							{{ 'GOLDENRATIO.DESCRIPTION1' | translate }}
						</p>

						<p
							class="lufgaregular mb-md-5 mb-sm-3 mb-2"
							[class]="
								translationService.currentLang() === 'ar'
									? 'size22'
									: 'size24'
							"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							{{ 'GOLDENRATIO.DESCRIPTION2' | translate }}
						</p>

						<p
							class="lufgaregular mb-md-5 mb-sm-3 mb-2"
							[class]="
								translationService.currentLang() === 'ar'
									? 'size22'
									: 'size24'
							"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							{{ 'GOLDENRATIO.DESCRIPTION3' | translate }}
						</p>

						<a href="#" class="btn-new lufgamedium size14 text-capitalize">
							{{ 'GOLDENRATIO.CTA' | translate }}
						</a>

					</div>

				</div>

			</div>
