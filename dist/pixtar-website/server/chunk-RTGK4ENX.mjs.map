<section class="u-section-80 template-question bannerLightColor">
	<div class="container-fluid">
		<div class="row">
			<div class="col-xxl-9 col-xl-9 col-lg-9 col-md-11 col-sm-11 col-11 mx-auto position-relative">
				<div class="row justify-content-between align-items-start">

					<!-- Left -->
					<div class="template-question-left col-lg-6 col-12">

						<!-- Badge -->
						<div class="label-badge"  data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"*ngIf="keyExists(sectionKey + '.BADGE')">
							<div class="dot"></div>

							<span
								class="lufgasemibold text-uppercase letterspacing10"
								[class]="
									translationService.currentLang() === 'ar'
										? 'size22'
										: 'size14'
								"
							>
								{{ sectionKey + '.BADGE' | translate }}
							</span>
						</div>

						<h2 class="size48 mb-0 lufgalight">
							<span *ngIf="keyExists(sectionKey + '.TITLE1')" class="c-text-textcolor1 me-2">
								{{ sectionKey + '.TITLE1' | translate }}
							</span>

							<span *ngIf="keyExists(sectionKey + '.BOLD')" class="lufgasemibold c-text-textcolor1 me-2">
								{{ sectionKey + '.BOLD' | translate }}
							</span>

							<span *ngIf="keyExists(sectionKey + '.TITLE2')" class="c-text-textcolor1">
								{{ sectionKey + '.TITLE2' | translate }}
							</span>
						</h2>

					</div>

					<!-- Right -->
					<div class="template-question-right col-lg-5 col-12">
						<p
							*ngFor="let description of getDescriptions()"
							class="lufgaregular size18 c-text-textcolor3 template-question-desc"
						>
							{{ description }}
						</p>
					</div>

				</div>
			</div>
		</div>
	</div>
</section>
