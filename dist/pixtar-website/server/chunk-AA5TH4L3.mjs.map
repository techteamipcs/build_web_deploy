<section class="global-section u-section-80">
	<div class="container-fluid">
		<div class="row">
			<div class="col-xxl-10 col-xl-10 col-lg-10 col-md-11 col-sm-11 col-11 mx-auto">
				<div class="row align-items-center">
					<!-- Content -->
					<div class="col-lg-5 col-12">
						<div
							class="global-section__content"
							data-aos="fade-up"
							data-aos-duration="1500"
							data-aos-delay="100"
						>
							<!-- Label -->
							<span
								class="bg-white c-text-textcolor1 bold rounded-pill px-3 py-2 mb-4 semibold size12 d-inline-block"
							>
								{{ 'SERVEGLOBAL.BADGE' | translate }}
							</span>

							<!-- Heading -->
							<h1 class="lufgalight size90 mb-4 global-section__title">
								{{ 'SERVEGLOBAL.TITLE1' | translate }}
								<span class="barcely">
									{{ 'SERVEGLOBAL.TITLE2' | translate }}
								</span>
								{{ 'SERVEGLOBAL.TITLE3' | translate }}
								<span class="lufgamedium inline">
									{{ 'SERVEGLOBAL.TITLE4' | translate }}
								</span>
							</h1>

							<!-- Description -->
							<div class="size24 line-height51">
								<p class="mb-0 regular">
									{{ 'SERVEGLOBAL.DESCRIPTION' | translate }}
								</p>
							</div>
						</div>
					</div>

					<!-- Map -->
					<div
						class="col-lg-7 col-12"
						data-aos="fade-up"
						data-aos-duration="1500"
						data-aos-delay="300"
					>
						<div class="global-section__map">
							<img
								src="./images/new-images/pixtar-world-map.png"
								[alt]="'SERVEGLOBAL.ALT' | translate"
								class="w-100 h-auto"
							/>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
