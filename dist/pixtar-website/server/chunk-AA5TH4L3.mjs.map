<section class="logos-section u-section-80" id="the-logos">
	<div class="container-fluid">
		<div class="row">
			<div class="col-xxl-9 col-xl-9 col-lg-9 col-md-11 col-sm-11 col-11 mx-auto position-relative">
				<div class="logos-section__grid">
					<!-- CONTENT -->
					<div class="logos-section__content">
						<div
							class="label-badge"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							<div class="dot"></div>

							<span
								class="lufgasemibold text-uppercase letterspacing10"
								[class]="translationService.currentLang() === 'ar' ? 'size22' : 'size14'"
							>
								{{ 'LOGOS.BADGE' | translate }}
							</span>
						</div>

						<h2
							class="size56 mb-md-5 mb-sm-3 mb-2 lufgalight"
							data-aos="fade-up"
							data-aos-duration="2000"
							data-aos-delay="100"
						>
							<span class="c-text-textcolor1">
								{{ 'LOGOS.TITLE1' | translate }}
							</span>

							<br class="d-none d-md-block" />

							<span class="c-text-textcolor1">
								{{ 'LOGOS.TITLE2' | translate }}
							</span>
							<span class="lufgamedium c-text-textcolor1">
								{{ 'LOGOS.TITLE3' | translate }}
							</span>
						</h2>
					</div>

					<!-- LOGOS -->
					<div class="logos-section__logos">
						@for (track of logoTracks; track $index; let trackIndex = $index) {
							<div class="logo-marquee" [class.logo-marquee--reverse]="trackIndex % 2 === 1">
								<div class="logo-marquee__track">
									@for (logo of track; track logo) {
										<div class="client-logo">
											<img [src]="logo" alt="Client logo" loading="lazy" />
										</div>
									}

									<!-- Duplicate for seamless infinite loop -->
									@for (logo of track; track logo + '-duplicate') {
										<div class="client-logo">
											<img [src]="logo" alt="Client logo" loading="lazy" />
										</div>
									}
								</div>
							</div>
						}
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
