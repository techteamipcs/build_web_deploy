<!-- our clients-->
<section class="u-section-80">
    <div class="container">
        <div class="col-xxl-12 col-xl-11 col-lg-11 col-md-11 col-ms-11 col-11 mx-auto" data-aos="fade-up"
            data-aos-duration="2000" data-aos-delay="100">
            <div class="label-badge">
            <h3 class=" semibold mb-0 text-uppercase gridtitle" 
            [class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size12 '"
            >
                {{ translationService.currentLang() === 'ar' ? 'عملائنا يشملون...' : 'Our clients include...' }}
            </h3></div>
            <div class="row">
                <ng-container>
                    <div class="col-md-12">
                        <div class="row">
                            <div class="col custom-col mb-lg-5 mb-md-4 mb-4"
                                *ngFor="let image of filteredClients; let i = index">
                                <img [src]="image.src"
 [alt]="image.alt"
 [title]="image.title" class="img-fluid"
                                    data-aos="zoom-in" data-aos-duration="1500" [ngClass]="image.class" width="210"
                                    decoding="async" height="50" loading="lazy" />
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</section>
<!-- our clients-->
