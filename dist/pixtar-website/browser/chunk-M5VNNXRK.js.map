<section class="u-section-top-80 position" id="the-postion">
	<div class="container">
		<div class="row">
			<div class="col-xxl-11 col-xl-11 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto px-md-4">
				<div class="row">
					<div class="label-badge">
                        <div class="dot"></div>
						<span
							class="lufgasemibold text-uppercase letterspacing10"
							[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size14 '"
							>{{ 'THEPOSITION.BADGE' | translate }}</span
						>
					</div>
					<h2
						class="size90 mb-md-5 mb-sm-3 mb-2 lufgalight"
						data-aos="fade-up"
						data-aos-duration="2000"
						data-aos-delay="100"
					>
						<span class=" c-text-textcolor1 me-md-3 me-2">{{ 'THEPOSITION.TITLE1' | translate }}</span>
						<span class="barcely inline">{{ 'THEPOSITION.BARCELY' | translate }}</span>
						<span class="c-text-textcolor1"> {{ 'THEPOSITION.TITLE2' | translate }}</span>
						<span class="d-md-block c-text-textcolor1"> {{ 'THEPOSITION.TITLE3' | translate }}</span>
					</h2>
					<p
						class="lufgaregular mb-md-5 mb-sm-3 mb-2 c-text-textcolor1 "
						[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size24 '"
						data-aos="fade-up"
						data-aos-duration="2000"
						data-aos-delay="100"
					>
						{{ 'THEPOSITION.DESCRIPTION1' | translate }}
					</p>
					<p
						class="lufgaregular mb-md-5 mb-sm-3 mb-2 c-text-textcolor1 "
						[class]="translationService.currentLang() === 'ar' ? 'size22 ' : 'size24 '"
						data-aos="fade-up"
						data-aos-duration="2000"
						data-aos-delay="100"
					>
						{{ 'THEPOSITION.DESCRIPTION2' | translate }}
					</p>
				</div>
			</div>
		</div>
	</div>
</section>
