@if (!product || product.length === 0) {
<div class="banner-skeleton" [ngClass]="isDark ? 'bannerDarkColor' : 'bannerLightColor'"></div>
} @else {
@let item = product[0];
<section class="cbanner position-relative" [ngClass]="isDark ? 'bannerDarkColor' : 'bannerLightColor'">
	<div class="container">
		@if (item?.media_data?.[0]?.src) {
		<img [src]="imgUrl + item.media_data[0].src" [alt]="item?.media_data[0].alt" [title]="item?.name" width="441"
			height="441" fetchpriority="high" loading="eager" decoding="async" class="floatImage"
			[ngClass]="imagePosition" />
		}
		<div class="row">
			<div class="col-xxl-12 col-xl-11 col-lg-11 col-md-11 col-sm-11 col-11 mx-auto">
				<div class="banner">
					<div class="d-flex flex-column justify-content-center h-100 align-items-start">
						<div class="banner-content" [ngClass]="contentClass">
							<h1 class="banner-title light size90" [innerHTML]="item | tField:'short_desc'"
								[ngClass]="isDark ? 'c-text-textcolor3' : 'c-text-textcolor1'">
							</h1>
							<div *ngIf="router.url === '/' || router.url === '/ar'" class="relative"
								[ngClass]="translationService.currentLang() === 'ar' ? 'mt-2 md:mt-5' : 'mt-2 md:mt-3'">
								<div class="linkToPackages m-0">
									<a [href]="translationService.localizedPath('/projects')"
										class="d-flex justify-content-start align-items-center">
										<span class="text semibold text-capitalize"
											[class]="translationService.currentLang() === 'ar' ? 'size16' : 'size14'"
											[ngClass]="isDark ? 'text-white' : 'c-text-textcolor1'">
											{{ translationService.currentLang() === 'ar' ? 'شاهد أعمالنا' : 'See Our
											Work'}}
										</span>

										<lucide-icon class="lucide-arrow-icon"
											[name]="translationService.currentLang() === 'ar' ? 'chevron-left' : 'chevron-right'">
										</lucide-icon>

										<span class="borderspan"></span>
									</a>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="position-absolute banner-left-content">
					<ul class="d-flex flex-column justify-content-between p-0 float-start mb-0">
						<li>
							<a href="https://www.instagram.com/pixtar.ae/" target="_blank" rel="noopener noreferrer">
								<img [src]="isDark ? baseUrl + '/images/social-media/instagram-white.svg' : baseUrl + '/images/social-media/instagram.svg'"
									alt="Explore branding and transformation projects"
									title="Instagram Branding Portfolio" width="15" height="15" loading="lazy"
									decoding="async" />
							</a>
						</li>
						<li>
							<a href="https://www.facebook.com/people/pixtarae/100086439813548/" target="_blank" rel="noopener noreferrer">
								<img [src]="isDark ? baseUrl + '/images/social-media/facebook-white.svg' : baseUrl + '/images/social-media/facebook.svg'"
									alt="Follow brand strategy and design insights" title="Pixtar Facebook Updates"
									width="10" height="18" loading="lazy" decoding="async" />
							</a>
						</li>
						<li>
							<a href="https://www.linkedin.com/company/pixtar-ae/" target="_blank"
								rel="noopener noreferrer">
								<img [src]="isDark ? baseUrl + '/images/social-media/linkedin-white.svg' : baseUrl + '/images/social-media/linkedin.svg'"
									alt="Connect with brand and digital transformation experts"
									title="Pixtar LinkedIn Network" width="15" height="15" loading="lazy"
									decoding="async" />
							</a>
						</li>
						<li>
							<a class="whatsapp-icon2 slideUpReturn tabmob" href="https://wa.me/+971527930781"
								target="_blank" rel="noopener noreferrer">
								<img [src]="isDark ? baseUrl + '/images/social-media/whatsapp-white.svg' : baseUrl + '/images/social-media/whatsapp.svg'"
									alt="Connect with our team for brand transformation" title="Contact Pixtar Team"
									width="18" height="18" loading="lazy" decoding="async" />
							</a>
						</li>
					</ul>
					<div class="d-flex flex-column justify-content-center left-content2 lufgaregular size18"
						[ngClass]="isDark ? 'text-white' : 'c-text-textcolor1'"
						[innerHTML]="translationService.currentLang() === 'ar' ? item.description_ar : item.description">
					</div>
				</div>
			</div>
		</div>
		<div class="position-absolute translate-middle down-arrow">
			<div class="linkToPackages">
				<a [href]="translationService.localizedPath(item?.userUrl || '/')"
					class="d-flex justify-content-start align-items-center">
					<span class="text semibold text-capitalize"
						[class]="translationService.currentLang() === 'ar' ? 'size16 ' : 'size14 '"
						[ngClass]="isDark ? 'text-white' : 'c-text-textcolor1'">
						{{ translationService.currentLang() === 'ar' ? item?.btnContent_ar : item?.btnContent
						}}
					</span>
					<lucide-icon [name]="translationService.currentLang() ==='ar' ? 'chevron-left' : 'chevron-right'"
						class="lucide-arrow-icon"></lucide-icon>
					<span class="borderspan"></span>
				</a>
			</div>
		</div>
	</div>
</section>
}
